# frpc —— 跑在你 Windows 这台机器上
# 下载：https://github.com/fatedier/frp/releases （windows_amd64）
# 启动：.\frpc.exe -c frpc.toml
#
# 效果：手机打开 http://<云服务器IP>:17788/?token=<mobile-token.txt 里的值>
# 17788 是以前手机端用的端口，APK 里的默认地址也是它，所以不用改 App。

serverAddr = "120.26.20.154"
serverPort = 7000

auth.method = "token"
auth.token = "和 frps.toml 里的一致"

[[proxies]]
name = "ot-mobile"
type = "tcp"
localIP = "127.0.0.1"
localPort = 7788
remotePort = 17788
