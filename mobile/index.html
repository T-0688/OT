<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>OT</title>
<meta name="theme-color" content="#151517" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; overflow-x: hidden; background: #151517; color: #f9fafb; font: 15px/1.65 -apple-system, "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif; }
  header { position: sticky; top: 0; z-index: 2; padding: 12px 16px; background: rgba(21,21,23,.92); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255,255,255,.08); display: flex; align-items: center; gap: 8px; }
  header b { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sub { color: #979da6; font-size: 12px; margin-left: auto; white-space: nowrap; }
  #log { padding: 14px 16px 190px; display: flex; flex-direction: column; gap: 10px; }
  .line { white-space: pre-wrap; word-break: break-word; }
  .user { align-self: flex-end; background: #2a2a33; padding: 8px 12px; border-radius: 14px 14px 4px 14px; max-width: 82%; }
  .agent { align-self: flex-start; max-width: 100%; }
  .tool { font-family: ui-monospace, Consolas, monospace; font-size: 12px; color: #979da6; border-left: 2px solid #33343a; padding-left: 8px; }
  .note { color: #f7ad31; font-size: 12px; }
  .agent p { margin: 0 0 8px; }
  .agent h1, .agent h2, .agent h3, .agent h4 { margin: 12px 0 6px; font-size: 16px; line-height: 1.4; }
  .agent ul, .agent ol { margin: 6px 0 8px; padding-left: 22px; }
  .agent li { margin: 2px 0; }
  .agent code { background: #232324; padding: 1px 5px; border-radius: 5px; font-family: ui-monospace, Consolas, monospace; font-size: 13px; }
  .agent pre { background: #1b1b1c; border: 1px solid rgba(255,255,255,.08); border-radius: 10px; padding: 10px 12px; overflow: auto; margin: 8px 0; }
  .agent pre code { background: none; padding: 0; font-size: 12.5px; }
  .agent blockquote { border-left: 2px solid #33343a; margin: 6px 0; padding-left: 10px; color: #cfd3d6; }
  .agent a { color: #7aaaff; }
  .agent hr { border: none; border-top: 1px solid rgba(255,255,255,.1); margin: 12px 0; }
  footer { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); background: rgba(21,21,23,.96); backdrop-filter: blur(14px); border-top: 1px solid rgba(255,255,255,.08); display: flex; flex-direction: column; gap: 8px; }
  .composer-row { display: flex; gap: 8px; align-items: flex-end; }
  textarea { flex: 1 1 auto; min-width: 0; width: 100%; resize: none; min-height: 42px; max-height: 120px; background: #232324; border: 1px solid rgba(255,255,255,.12); border-radius: 12px; color: inherit; padding: 10px 12px; font: inherit; }
  button { border: none; border-radius: 12px; flex: 0 0 auto; height: 44px; padding: 0 16px; font: inherit; font-weight: 600; background: #f9fafb; color: #0f1115; }
  button:disabled { opacity: .4; }
  .plus { width: 44px; padding: 0; background: #232324; color: #cfd3d6; border: 1px solid rgba(255,255,255,.12); font-size: 20px; font-weight: 400; }
  .attach { display: flex; flex-wrap: wrap; gap: 6px; }
  .attach:empty { display: none; }
  .chip { display: flex; align-items: center; gap: 6px; background: #232324; border: 1px solid rgba(255,255,255,.1); border-radius: 10px; padding: 4px 8px; font-size: 12px; color: #cfd3d6; max-width: 100%; }
  .chip img { width: 26px; height: 26px; object-fit: cover; border-radius: 6px; }
  .chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 180px; }
  .chip button { height: 20px; width: 20px; padding: 0; border-radius: 50%; background: transparent; color: #979da6; font-size: 14px; font-weight: 400; }
  .perm { background: #232324; border: 1px solid rgba(255,255,255,.14); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
  .perm .acts { display: flex; gap: 8px; }
  .perm .acts button { flex: 1; height: 36px; }
  .perm .acts .no { background: transparent; color: #f25a5a; border: 1px solid rgba(242,90,90,.4); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #41c977; flex: 0 0 auto; }
  .dot.run { background: #f7ad31; animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: .35 } }
  .ghost { background: transparent; color: #cfd3d6; border: 1px solid rgba(255,255,255,.16); height: 30px; padding: 0 12px; font-weight: 500; font-size: 13px; }
  .sheet { position: fixed; inset: 0; z-index: 10; background: rgba(10,10,12,.96); backdrop-filter: blur(10px); display: flex; flex-direction: column; transition: transform .22s ease, opacity .22s ease; }
  .sheet.hidden { transform: translateX(-100%); opacity: 0; pointer-events: none; }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid rgba(255,255,255,.08); }
  #sessions { overflow: auto; padding: 10px 8px 40px; }
  .sess { display: flex; flex-direction: column; gap: 3px; width: 100%; height: auto; min-height: 52px; text-align: left; background: transparent; color: inherit; border: none; border-radius: 10px; padding: 9px 12px; }
  .sess:active, .sess.on { background: #232324; }
  .sess b { font-weight: 500; font-size: 14px; line-height: 1.35; color: #f9fafb; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sess span { font-size: 11px; color: #979da6; font-family: ui-monospace, Consolas, monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  body.light { background: #f5f7fa; color: #0f1115; }
  body.light header { background: rgba(245,247,250,.94); border-bottom-color: rgba(0,0,0,.08); }
  body.light footer { background: rgba(245,247,250,.96); border-top-color: rgba(0,0,0,.08); }
  body.light .user { background: #e4e7ee; }
  body.light .tool { color: #6b7280; border-left-color: #d5d9e2; }
  body.light textarea { background: #fff; border-color: rgba(0,0,0,.12); color: #0f1115; }
  body.light .plus { background: #fff; color: #4b5563; border-color: rgba(0,0,0,.12); }
  body.light button { background: #111827; color: #fff; }
  body.light .ghost { background: transparent; color: #374151; border-color: rgba(0,0,0,.16); }
  body.light .chip { background: #fff; border-color: rgba(0,0,0,.1); color: #374151; }
  body.light .sess { background: transparent; color: #374151; }
  body.light .sess.on, body.light .sess:active { background: #e9edf5; }
  body.light .sess span { color: #6b7280; }
  body.light #sessions .tool { color: #6b7280; }
  body.light .sess b { color: #0f1115; }
  body.light .agent code, body.light .agent pre { background: #eef1f6; border-color: rgba(0,0,0,.08); }
  body.light .sheet { background: rgba(245,247,250,.98); }
  .icon-btn2 { width: 30px; padding: 0; height: 30px; font-size: 14px; font-weight: 400; }
.toast {
  position: fixed; left: 50%; bottom: 96px; transform: translate(-50%, 8px);
  background: rgba(17,18,22,.92); color: #fff; font-size: 13px;
  padding: 8px 14px; border-radius: 10px; opacity: 0;
  transition: opacity .2s, transform .2s; z-index: 50; pointer-events: none;
  max-width: 82vw; text-align: center;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
body.light .toast { background: rgba(17,18,22,.9); }
</style></head>
<body>
<header><span class="dot" id="dot"></span><b id="title">OT</b><button id="theme" class="ghost icon-btn2">☾</button><button id="refresh" class="ghost icon-btn2">↻</button><span class="sub" id="sub">连接中…</span></header>
<div id="log"></div>
<footer>
  <div class="attach" id="attach"></div>
  <div class="composer-row">
    <button id="plus" class="plus" title="上传图片或文件">＋</button>
    <textarea id="input" rows="1" placeholder="回复 agent…"></textarea>
    <button id="send">发送</button>
  </div>
</footer>
<div id="sheet" class="sheet hidden"><div class="sheet-head"><b>会话</b><button id="closeSheet" class="ghost">关闭</button></div><div id="sessions"></div></div>
<input type="file" id="picker" multiple style="display:none" accept="image/*,.pdf,.txt,.md,.json,.csv,.log,.zip,.doc,.docx,.xls,.xlsx,.ppt,.pptx" />
<script>
const params = new URLSearchParams(location.search);
const token = params.get('token') || '';
const host = params.get('host') || location.host;
const log = document.getElementById('log');
const dot = document.getElementById('dot');
const sub = document.getElementById('sub');
const title = document.getElementById('title');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const plusBtn = document.getElementById('plus');
const picker = document.getElementById('picker');
const attachBox = document.getElementById('attach');
const sheet = document.getElementById('sheet');
const sessionsBox = document.getElementById('sessions');
let ws, cur = null, currentId = '', curRaw = '';
let attachments = [];

function escHtml(s) {
  return s.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
}
function inlineMd(s) {
  return s
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*]+)\*/g, '$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g, '<a href="$2" target="_blank" rel="noreferrer">$1</a>');
}
function md(src) {
  const lines = src.replace(/\r/g, '').split('\n');
  let out = '', inCode = false, codeBuf = [], listType = null;
  const closeList = () => { if (listType) { out += listType === 'ul' ? '</ul>' : '</ol>'; listType = null; } };
  for (const line of lines) {
    if (/^```/.test(line.trim())) {
      if (inCode) { out += '<pre><code>' + escHtml(codeBuf.join('\n')) + '</code></pre>'; codeBuf = []; inCode = false; }
      else { closeList(); inCode = true; }
      continue;
    }
    if (inCode) { codeBuf.push(line); continue; }
    if (!line.trim()) { closeList(); continue; }
    let m;
    if ((m = /^(#{1,4})\s+(.*)$/.exec(line))) {
      closeList();
      const lvl = m[1].length;
      out += '<h' + lvl + '>' + inlineMd(escHtml(m[2])) + '</h' + lvl + '>';
      continue;
    }
    if ((m = /^\s*[-*+]\s+(.*)$/.exec(line))) {
      if (listType !== 'ul') { closeList(); out += '<ul>'; listType = 'ul'; }
      out += '<li>' + inlineMd(escHtml(m[1])) + '</li>';
      continue;
    }
    if ((m = /^\s*\d+\.\s+(.*)$/.exec(line))) {
      if (listType !== 'ol') { closeList(); out += '<ol>'; listType = 'ol'; }
      out += '<li>' + inlineMd(escHtml(m[1])) + '</li>';
      continue;
    }
    if ((m = /^>\s?(.*)$/.exec(line))) {
      closeList();
      out += '<blockquote>' + inlineMd(escHtml(m[1])) + '</blockquote>';
      continue;
    }
    if (/^(-{3,}|\*{3,})$/.test(line.trim())) { closeList(); out += '<hr />'; continue; }
    closeList();
    out += '<p>' + inlineMd(escHtml(line)) + '</p>';
  }
  if (inCode) out += '<pre><code>' + escHtml(codeBuf.join('\n')) + '</code></pre>';
  closeList();
  return out;
}

function add(role, text) {
  const el = document.createElement('div');
  el.className = 'line ' + role;
  el.textContent = text;
  log.appendChild(el);
  window.scrollTo(0, document.body.scrollHeight);
  return el;
}
function setStatus(s) {
  sub.textContent = s;
  dot.className = 'dot' + (s === '运行中' ? ' run' : '');
}
let retry = 800;
function cacheKey(suffix) { return 'omp.' + suffix + '.' + host; }
function toast(text) {
  try {
    const el = document.createElement('div');
    el.className = 'toast';
    el.textContent = text;
    document.body.appendChild(el);
    setTimeout(() => el.classList.add('show'), 20);
    setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 300); }, 2600);
  } catch (e) {}
}

function showLocalNotification(title, body) {
  try {
    if (window.OTNotify && window.OTNotify.post) {
      window.OTNotify.post(title, body);
      return;
    }
  } catch (e) {}
  try {
    if ('Notification' in window) {
      if (Notification.permission === 'granted') new Notification(title, { body: body });
      else if (Notification.permission !== 'denied') {
        Notification.requestPermission().then((p) => { if (p === 'granted') new Notification(title, { body: body }); });
      }
    }
  } catch (e) {}
}

function connect() {
  const isLocal = /^(127\.|localhost|192\.168\.|10\.|172\.(1[6-9]|2\d|3[01])\.)/i.test(host) || /:\d+$/.test(host);
  const proto = isLocal ? 'ws://' : 'wss://';
  try { if (window.OTNotify && window.OTNotify.setTarget) window.OTNotify.setTarget(host, token, isLocal ? 'ws' : 'wss'); } catch (e) {}
  ws = new WebSocket(proto + host + '/ws?token=' + encodeURIComponent(token));
  try { if (window.OTNotify && window.OTNotify.canNotify && !window.OTNotify.canNotify()) { setTimeout(() => toast('请允许 OT 的通知权限，否则后台收不到提醒'), 1200); } } catch (e) {}
  ws.onopen = () => { retry = 800; setStatus('已连接'); };
  ws.onclose = () => {
    setStatus('已断开');
    retry = Math.min(5000, Math.max(800, retry * 1.6));
    setTimeout(connect, retry);
  };
  ws.onmessage = (ev) => {
    lastSeen = Date.now();
    const m = JSON.parse(ev.data);
    if (m.t === 'hello') {
      title.textContent = m.title || 'OT';
      try { localStorage.setItem(cacheKey('history'), JSON.stringify({ title: m.title, history: m.history || [], id: m.id })); } catch {}
      setStatus(m.status === 'running' ? '运行中' : '空闲');
      currentId = m.id || '';
      log.innerHTML = '';
      curRaw = '';
      (m.history || []).forEach((l) => {
        if (l.role === 'agent') { cur = add('agent', ''); curRaw = l.text; cur.innerHTML = md(l.text); }
        else { cur = add(l.role, l.text); }
      });
    } else if (m.t === 'sessions') {
      try { localStorage.setItem(cacheKey('sessions'), JSON.stringify(m.list || [])); } catch {}
      renderSessions(m.list || [], m.current || currentId);
    } else if (m.t === 'user') {
      cur = add('user', m.text);
    } else if (m.t === 'text') {
      if (!cur || cur.className.indexOf('agent') < 0) { cur = add('agent', ''); curRaw = ''; }
      curRaw += m.text;
      cur.innerHTML = md(curRaw);
      window.scrollTo(0, document.body.scrollHeight);
    } else if (m.t === 'tool') {
      cur = add('tool', m.title || '工具');
    } else if (m.t === 'note') {
      add('note', m.text);
    } else if (m.t === 'status') {
      setStatus(m.text);
    } else if (m.t === 'notify') {
      const ntitle = m.title || 'OT';
      const nbody = m.body || '当前任务完成';
      let svc = false;
      try { svc = !!(window.OTNotify && window.OTNotify.serviceRunning && window.OTNotify.serviceRunning()); } catch (e) {}
      if (document.hidden && !svc) showLocalNotification(ntitle, nbody);
      else toast(nbody);
    } else if (m.t === 'turn_end') {
      setStatus('空闲');
      cur = null;
    } else if (m.t === 'reset') {
      log.innerHTML = '';
      cur = null;
      curRaw = '';
    } else if (m.t === 'file_saved') {
      const item = attachments.find((a) => a.id === m.id);
      if (item) { item.path = m.path; renderAttach(); }
    } else if (m.t === 'permission') {
      const box = document.createElement('div');
      box.className = 'perm';
      const p = document.createElement('div');
      p.textContent = m.title;
      const acts = document.createElement('div');
      acts.className = 'acts';
      (m.options || []).forEach((o) => {
        const b = document.createElement('button');
        b.textContent = o.label;
        if (o.kind === 'reject') b.className = 'no';
        b.onclick = () => {
          ws.send(JSON.stringify({ type: 'permission', id: m.id, optionId: o.optionId }));
          acts.querySelectorAll('button').forEach((x) => (x.disabled = true));
        };
        acts.appendChild(b);
      });
      box.appendChild(p); box.appendChild(acts);
      log.appendChild(box);
      window.scrollTo(0, document.body.scrollHeight);
    }
  };
}
function renderSessions(list, current) {
  sessionsBox.innerHTML = '';
  if (!list.length) {
    const empty = document.createElement('div');
    empty.className = 'tool';
    empty.textContent = '还没有会话';
    sessionsBox.appendChild(empty);
    return;
  }
  list.forEach((s) => {
    const b = document.createElement('button');
    b.className = 'sess' + (s.id === current ? ' on' : '');
    const t = document.createElement('b'); t.textContent = s.title || '新会话';
    const d = document.createElement('span');
    d.textContent = (s.cwd || '').split(/[\\/]/).pop() + ' · ' + (s.updatedAt || s.createdAt || '').slice(0, 16).replace('T', ' ');
    b.appendChild(t); b.appendChild(d);
    b.onclick = () => {
      sheet.classList.add('hidden');
      title.textContent = s.title || 'OT';
      ws.send(JSON.stringify({ type: 'open', id: s.id }));
      setStatus('切换中…');
    };
    sessionsBox.appendChild(b);
  });
}
function openSheet() {
  sheet.classList.remove('hidden');
  sessionsBox.innerHTML = '<div class="tool">加载中…</div>';
  ws.send(JSON.stringify({ type: 'sessions' }));
}
document.getElementById('closeSheet').onclick = () => sheet.classList.add('hidden');

/* 右滑打开会话列表，左滑关闭 */
let startX = null, startY = null;
document.addEventListener('touchstart', (e) => {
  const t = e.touches[0];
  startX = t.clientX; startY = t.clientY;
}, { passive: true });
document.addEventListener('touchend', (e) => {
  if (startX === null) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - startX;
  const dy = t.clientY - startY;
  if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.6) {
    if (dx > 0 && startX < 70 && sheet.classList.contains('hidden')) openSheet();
    else if (dx < 0 && !sheet.classList.contains('hidden')) sheet.classList.add('hidden');
  }
  startX = null; startY = null;
}, { passive: true });

function readAsDataURL(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}
function renderAttach() {
  attachBox.innerHTML = '';
  attachments.forEach((a, idx) => {
    const chip = document.createElement('div');
    chip.className = 'chip';
    if (a.kind === 'image') {
      const img = document.createElement('img');
      img.src = 'data:' + a.mimeType + ';base64,' + a.data;
      chip.appendChild(img);
    }
    const label = document.createElement('span');
    label.textContent = a.name + (a.kind === 'file' && !a.path ? '（上传中…）' : '');
    chip.appendChild(label);
    const x = document.createElement('button');
    x.textContent = '×';
    x.onclick = () => { attachments.splice(idx, 1); renderAttach(); };
    chip.appendChild(x);
    attachBox.appendChild(chip);
  });
}
plusBtn.onclick = () => picker.click();
picker.onchange = async () => {
  for (const file of picker.files) {
    const dataUrl = await readAsDataURL(file);
    const base64 = String(dataUrl).split(',')[1] || '';
    if ((file.type || '').indexOf('image/') === 0) {
      attachments.push({ kind: 'image', name: file.name, mimeType: file.type || 'image/png', data: base64 });
    } else {
      const id = Math.random().toString(36).slice(2);
      attachments.push({ kind: 'file', id, name: file.name, data: base64, path: null });
      ws.send(JSON.stringify({ type: 'file', id, name: file.name, data: base64 }));
    }
  }
  picker.value = '';
  renderAttach();
};

sendBtn.onclick = () => {
  if (!ws || ws.readyState !== 1) return;
  const pendingUpload = attachments.some((a) => a.kind === 'file' && !a.path);
  if (pendingUpload) { add('note', '文件还在上传，稍等一下'); return; }
  const images = attachments.filter((a) => a.kind === 'image').map((a) => ({ data: a.data, mimeType: a.mimeType, name: a.name }));
  const paths = attachments.filter((a) => a.kind === 'file' && a.path).map((a) => a.path);
  let text = input.value.trim();
  if (!text && !images.length && !paths.length) return;
  if (paths.length) text += (text ? '\n\n' : '') + '[附带的文件]\n' + paths.map((p) => '- ' + p).join('\n');
  ws.send(JSON.stringify({ type: 'prompt', text, images }));
  input.value = '';
  attachments = [];
  renderAttach();
};
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) sendBtn.click();
});
const themeBtn = document.getElementById('theme');
const refreshBtn = document.getElementById('refresh');
function applyTheme(t) {
  document.body.classList.toggle('light', t === 'light');
  themeBtn.textContent = t === 'light' ? '☀' : '☾';
  localStorage.setItem('ot-theme', t);
}
applyTheme(localStorage.getItem('ot-theme') || 'dark');
themeBtn.onclick = () => applyTheme(document.body.classList.contains('light') ? 'dark' : 'light');
refreshBtn.onclick = () => {
  setStatus('重连中…');
  try { if (ws) ws.close(); } catch (e) {}
  setTimeout(connect, 300);
};
setInterval(() => {
  if (ws && ws.readyState === 1) {
    try { ws.send(JSON.stringify({ type: 'ping' })); } catch (e) {}
  }
}, 10000);
let lastSeen = Date.now();
setInterval(() => {
  if (ws && ws.readyState === 1 && Date.now() - lastSeen > 35000) {
    setStatus('重连中…');
    try { ws.close(); } catch (e) {}
  }
}, 5000);

window.__otResume = () => {
  if (!ws || ws.readyState > 1) { retry = 800; connect(); }
};
window.addEventListener('online', () => {
  if (!ws || ws.readyState > 1) connect();
});

document.addEventListener('visibilitychange', () => {
  if (!document.hidden && (!ws || ws.readyState > 1)) connect();
});

// 长按标题可改连接地址（同一 Wi-Fi 下用局域网地址明显更快）
let pressTimer = null;
title.addEventListener('pointerdown', () => {
  pressTimer = setTimeout(() => {
    const next = prompt('连接地址（http://IP:7788/?token=...）', host ? 'http://' + host + '/?token=' + token : '');
    if (!next) return;
    try {
      const u = new URL(next);
      localStorage.setItem('omp.url', next);
      location.href = u.href;
    } catch { alert('地址格式不对'); }
  }, 650);
});
title.addEventListener('pointerup', () => clearTimeout(pressTimer));
title.addEventListener('pointercancel', () => clearTimeout(pressTimer));

// 保存过的自定义地址优先
try {
  const saved = localStorage.getItem('omp.url');
  if (saved) {
    const u = new URL(saved);
    if (u.host !== host) {
      location.href = u.href;
    }
  }
} catch {}

// 先用缓存把上次对话画出来，WS 连上后再校准
try {
  const cached = JSON.parse(localStorage.getItem(cacheKey('history')) || 'null');
  if (cached && cached.history) {
    title.textContent = cached.title || 'OT';
    currentId = cached.id || '';
    log.innerHTML = '';
    curRaw = '';
    cached.history.forEach((l) => {
      if (l.role === 'agent') { cur = add('agent', ''); curRaw = l.text; cur.innerHTML = md(l.text); }
      else { cur = add(l.role, l.text); }
    });
    setStatus('连接中…');
  }
} catch {}

connect();
</script>
</body></html>
