apply plugin: "com.android.application"

android {
    namespace "dev.ot.app"
    compileSdk 33

    defaultConfig {
        applicationId "dev.ot.app"
        minSdk 24
        targetSdk 33
        versionCode 240
        versionName "1.14.0"
    }

    buildTypes {
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}















